version: '3.8'

services:
  # Frontend - React/Vite client
  client:
    image: ghcr.io/danidaj/softspace-client:latest
    container_name: softspace-client
    restart: unless-stopped
    networks:
      - portfolio-net
      - softspace-network
    depends_on:
      - server

  # Backend - FastAPI server
  server:
    image: ghcr.io/danidaj/softspace-server:latest
    container_name: softspace-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=https://softspace.danidajay.com
    networks:
      - portfolio-net
      - softspace-network

networks:
  softspace-network:
    driver: bridge
  portfolio-net:
    external: true
