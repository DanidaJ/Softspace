# Softspace Nginx Configuration for VPS
# File: /root/nginx/conf.d/softspace.conf

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name softspace.danidajay.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main configuration
server {
    listen 443 ssl;
    server_name softspace.danidajay.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/softspace.danidajay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softspace.danidajay.com/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS server. Without this, nginx resolves upstream
    # container names once at startup and caches the IP forever, so every
    # `docker compose up -d` (which recreates containers with new IPs)
    # leaves this proxy pointing at a dead address until it is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend - React/Vite app
    location / {
        # Upstream via variable, which forces nginx to re-resolve per request
        set $upstream_client softspace-client;
        proxy_pass http://$upstream_client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API - FastAPI
    location /api {
        # Must precede the rewrite below: `break` halts the rewrite module,
        # and `set` belongs to that module, so a `set` after it never runs.
        set $upstream_server softspace-server;

        # Remove /api prefix when proxying to backend
        rewrite ^/api(.*)$ $1 break;

        proxy_pass http://$upstream_server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings for AI responses (can take time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health check endpoint (direct to backend)
    location /health {
        set $upstream_health softspace-server;
        proxy_pass http://$upstream_health:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
