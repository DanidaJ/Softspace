version: '3.8'

services:
  # Frontend - React/Vite client
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://softspace.danidajay.com/api
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    image: softspace-client:latest
    container_name: softspace-client
    restart: unless-stopped
    networks:
      - portfolio-net
      - softspace-network
    depends_on:
      - server

  # Backend - FastAPI server
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: softspace-server:latest
    container_name: softspace-server
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ALLOWED_ORIGINS=https://softspace.danidajay.com
    networks:
      - portfolio-net
      - softspace-network

networks:
  softspace-network:
    driver: bridge
  portfolio-net:
    external: true
